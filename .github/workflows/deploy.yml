name: Deploy

# Runs after CI finishes on main, or manually via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      skip_burst_wait:
        description: 'Skip waiting for burst to complete'
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Vercel: public/ is the project root (see public/vercel.json).
      - name: Deploy to Vercel
        working-directory: public
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx -y vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

      # Railway: agora-banana service, production environment.
      # Hold the Railway deploy briefly for in-flight bursts to finish. If the referee
      # is unreachable or a burst remains active after the watchdog window, deploy anyway.
      - name: Wait for any live burst to finish
        if: env.RAILWAY_TOKEN != '' && github.event.inputs.skip_burst_wait != 'true'
        run: |
          for i in $(seq 1 12); do
            active=$(curl -s -m 10 https://agora-banana-production.up.railway.app/referee/ticker/status \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('burst_active'))" 2>/dev/null || echo unknown)
            echo "check $i: burst_active=$active"
            [ "$active" = "True" ] || exit 0
            sleep 10
          done
          echo "::warning::burst wait timed out after 2 minutes; deploying anyway"

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: npx -y @railway/cli up --service agora-banana --environment production --detach
